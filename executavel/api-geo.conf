# Spring Boot fully executable JAR configuration
# Se este JAR for executado diretamente via ./api-geo.jar, este arquivo é lido automaticamente.

# Aponta para o JDK 17 caso a máquina tenha versão anterior como padrão
if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
    if [ -x "/home/niuan/.jdks/jdk-17.0.21+9/bin/java" ]; then
        JAVA_HOME="/home/niuan/.jdks/jdk-17.0.21+9"
    fi
fi

# Carrega .env se existir na mesma pasta
if [ -f "$(dirname "$0")/.env" ]; then
    set -a
    source "$(dirname "$0")/.env"
    set +a
fi
