calculo-analitico.fontes.alertas=${CALCULO_ANALITICO_FONTES_ALERTAS:INPE_DESMATAMENTO_MATA_ATLANTICA,INPE_DESMATAMENTO_CERRADO,IBAMA_EMBARGO,FUNAI_TERRA_INDIGENA,INCRA_QUILOMBOLA,INCRA_ASSENTAMENTO,INPE_QUEIMADA}
