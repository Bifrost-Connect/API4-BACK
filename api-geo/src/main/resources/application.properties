spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_geo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tarefa 11: quais fontes da camada_referencia entram em cada cruzamento do cálculo analítico.
# APP e Reserva Legal ainda não estão na lista da V18; quando forem carregadas via ogr2ogr,
# é só usar esses mesmos nomes de fonte (ou trocar aqui)
calculo-analitico.fontes.app=INCAR_APP
calculo-analitico.fontes.reserva-legal=INCAR_RESERVA_LEGAL
calculo-analitico.fontes.alertas=INPE_DESMATAMENTO_MATA_ATLANTICA,INPE_DESMATAMENTO_CERRADO,IBAMA_EMBARGO
spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3GB
